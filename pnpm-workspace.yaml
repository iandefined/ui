  "@bprogress/react": 1.2.7
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  "@tailwindcss/postcss": 4.3.3
  "@tanstack/react-router": 1.170.31
  "@tanstack/react-start": 1.168.48
  "@tanstack/router-plugin": 1.168.34
  "@types/mdx": 2.0.14
  "@types/node": 26.3.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@vitejs/plugin-react": 6.1.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  fumadocs-core: 16.15.0
  fumadocs-mdx: 15.3.1
  jotai: 2.20.2
  lru-cache: 11.5.2
  lucide-react: 1.33.0
  motion: 13.1.1
  next-themes: 0.4.6
  postcss: 8.5.26
  react: 19.2.8
  react-dom: 19.2.8
  react-hotkeys-hook: 5.3.3
  rehype-pretty-code: 0.14.5
  shadcn: 4.19.0
  shiki: 4.4.3
  sonner: 2.0.8
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
